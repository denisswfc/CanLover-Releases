<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CanLover — Release History</title>
  <meta name="description" content="Full release history for CanLover — professional CAN bus analysis tool." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://canlover.ddns.net/releases.html" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />

  <style>
    :root {
      --crust:    #11111b;
      --mantle:   #181825;
      --base:     #1e1e2e;
      --surface0: #313244;
      --surface1: #45475a;
      --surface2: #585b70;
      --overlay0: #6c7086;
      --subtext0: #a6adc8;
      --subtext1: #bac2de;
      --text:     #cdd6f4;
      --lavender: #b4befe;
      --blue:     #89b4fa;
      --green:    #a6e3a1;
      --peach:    #fab387;
      --red:      #f38ba8;
      --mauve:    #cba6f7;
      --accent:   var(--blue);
      --radius:   10px;
      --radius-lg:16px;
      --mono:     'JetBrains Mono', 'Fira Code', monospace;
      --sans:     'Inter', system-ui, -apple-system, sans-serif;
      --transition: 0.2s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--base);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; transition: color var(--transition); }
    a:hover { color: var(--lavender); }
    img { display: block; max-width: 100%; }

    .container { max-width: 1200px; margin: 0 auto; padding: 0 1.5rem; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.375rem;
      font-size: 0.75rem;
      font-weight: 600;
      font-family: var(--mono);
      padding: 0.25rem 0.625rem;
      border-radius: 4px;
      background: var(--surface0);
      color: var(--subtext1);
      border: 1px solid var(--surface1);
    }
    .badge--green { background: rgba(166,227,161,0.12); color: var(--green); border-color: rgba(166,227,161,0.3); }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius);
      font-family: var(--sans);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform var(--transition), box-shadow var(--transition), background var(--transition);
      white-space: nowrap;
    }
    .btn:hover { transform: translateY(-1px); }
    .btn-primary { background: var(--blue); color: var(--mantle); box-shadow: 0 4px 16px rgba(137,180,250,0.3); }
    .btn-primary:hover { background: var(--lavender); color: var(--mantle); }
    .btn-secondary { background: var(--surface0); color: var(--text); border: 1px solid var(--surface1); }
    .btn-secondary:hover { background: var(--surface1); color: var(--text); }
    .btn-outline { background: transparent; color: var(--blue); border: 1.5px solid var(--blue); }
    .btn-outline:hover { background: rgba(137,180,250,0.1); color: var(--lavender); border-color: var(--lavender); }
    .btn-sm { padding: 0.4rem 0.875rem; font-size: 0.8rem; gap: 0.375rem; }

    /* Nav */
    .nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(24, 24, 37, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--surface0);
    }
    .nav-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
    }
    .nav-logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text);
      text-decoration: none;
    }
    .nav-logo-icon {
      width: 32px; height: 32px;
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0; overflow: hidden;
    }
    .nav-logo-icon img { width: 32px; height: 32px; object-fit: contain; }
    .nav-actions { display: flex; align-items: center; gap: 0.75rem; }

    /* Page header */
    .page-header {
      padding: 4rem 0 2.5rem;
      border-bottom: 1px solid var(--surface0);
      background: var(--mantle);
    }
    .page-header-inner {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
    }
    .page-header-label {
      font-size: 0.75rem;
      font-family: var(--mono);
      font-weight: 600;
      color: var(--blue);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.6rem;
    }
    .page-header h1 {
      font-size: clamp(1.75rem, 4vw, 2.5rem);
      font-weight: 800;
      color: var(--text);
      line-height: 1.15;
    }
    .page-header p {
      margin-top: 0.6rem;
      font-size: 1rem;
      color: var(--subtext1);
    }

    /* Releases list */
    .releases-page { padding: 3rem 0 6rem; }
    .releases-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 860px;
      margin: 0 auto;
    }
    .release-card {
      background: var(--mantle);
      border: 1px solid var(--surface0);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: border-color 0.2s;
    }
    .release-card:hover { border-color: var(--surface2); }
    .release-card--latest { border-color: rgba(137,180,250,0.35); box-shadow: 0 0 0 1px rgba(137,180,250,0.12); }
    .release-card--beta { border-color: rgba(250,179,135,0.3); }
    .release-card--beta .release-tag { color: var(--peach); }
    .release-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      padding: 1.25rem 1.5rem;
      background: var(--crust);
      border-bottom: 1px solid var(--surface0);
    }
    .release-meta { display: flex; align-items: center; gap: 0.875rem; }
    .release-tag { font-family: var(--mono); font-size: 1rem; font-weight: 700; color: var(--blue); }
    .release-date { font-size: 0.8rem; color: var(--subtext0); }
    .release-downloads { display: flex; gap: 0.625rem; flex-wrap: wrap; }
    .release-body { padding: 1.25rem 1.5rem; color: var(--subtext1); font-size: 0.88rem; line-height: 1.7; }
    .release-body h2, .release-body h3 { color: var(--text); margin: 1rem 0 0.4rem; font-size: 0.95rem; }
    .release-body h2:first-child, .release-body h3:first-child { margin-top: 0; }
    .release-body ul { padding-left: 1.25rem; margin: 0.25rem 0 0.75rem; }
    .release-body li { margin-bottom: 0.2rem; }
    .release-body code { background: var(--surface0); border-radius: 4px; padding: 0.1em 0.35em; font-family: var(--mono); font-size: 0.85em; color: var(--peach); }
    .release-body p { margin: 0.4rem 0; }
    .release-body strong { color: var(--text); }

    .releases-loading { text-align: center; padding: 3rem; color: var(--subtext0); font-size: 0.9rem; }
    .releases-error { text-align: center; padding: 2rem; color: var(--red); font-size: 0.88rem; }

    @media (max-width: 600px) {
      .release-card-header { flex-direction: column; align-items: flex-start; }
      .page-header-inner { flex-direction: column; align-items: flex-start; }
    }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: var(--mantle); }
    ::-webkit-scrollbar-thumb { background: var(--surface1); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--surface2); }
  </style>
</head>
<body>

  <header class="nav">
    <div class="container nav-inner">
      <a href="index.html" class="nav-logo">
        <div class="nav-logo-icon">
          <img src="canlover_icon.png" alt="CanLover" />
        </div>
        CanLover
      </a>
      <div class="nav-actions">
        <a href="index.html" class="btn btn-outline" style="padding:0.5rem 1rem;font-size:0.85rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back to home
        </a>
        <a href="index.html#cta" class="btn btn-primary" style="padding:0.5rem 1rem;font-size:0.85rem;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          Download
        </a>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container page-header-inner">
      <div>
        <div class="page-header-label">Changelog</div>
        <h1>Release History</h1>
        <p>All CanLover releases — every version goes through more than 240 automated tests.</p>
      </div>
      <div id="release-count" style="font-size:0.85rem;color:var(--subtext0);"></div>
    </div>
  </div>

  <div class="releases-page">
    <div class="container">
      <div class="releases-list" id="releases-list">
        <div class="releases-loading">Loading releases…</div>
      </div>
    </div>
  </div>

  <script>
    (async () => {
      const REPO = 'denisswfc/CanLover-Releases';
      const API  = `https://api.github.com/repos/${REPO}/releases`;
      const list = document.getElementById('releases-list');
      const countEl = document.getElementById('release-count');

      function mdToHtml(md) {
        if (!md) return '';
        const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        const inline = s => esc(s)
          .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
          .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
          .replace(/`([^`]+)`/g, '<code>$1</code>');
        const lines = md.replace(/\r\n/g, '\n').split('\n');
        let out = '';
        const stack = [];        // indent widths of currently open <ul> levels
        let para = false;
        const closePara  = () => { if (para) { out += '</p>'; para = false; } };
        const closeLists = () => { while (stack.length) { out += '</li></ul>'; stack.pop(); } };
        for (const raw of lines) {
          const li = raw.match(/^(\s*)[-*]\s+(.*)$/);
          const h2 = raw.match(/^##\s+(.*)$/);
          const h3 = raw.match(/^###\s+(.*)$/);
          if (li) {
            closePara();
            const indent = li[1].replace(/\t/g, '  ').length;
            if (!stack.length || indent > stack[stack.length - 1]) {
              out += '<ul>';                 // deeper level nests inside the open <li>
              stack.push(indent);
            } else {
              while (stack.length && indent < stack[stack.length - 1]) {
                out += '</li></ul>';
                stack.pop();
              }
              out += '</li>';                // sibling — close the previous item
            }
            out += '<li>' + inline(li[2]);
          } else if (h3) {
            closePara(); closeLists(); out += '<h3>' + inline(h3[1]) + '</h3>';
          } else if (h2) {
            closePara(); closeLists(); out += '<h2>' + inline(h2[1]) + '</h2>';
          } else if (raw.trim() === '') {
            closePara(); closeLists();
          } else {
            closeLists();
            if (!para) { out += '<p>'; para = true; } else { out += ' '; }
            out += inline(raw.trim());
          }
        }
        closePara(); closeLists();
        return out;
      }

      function assetIcon(name) {
        if (/\.AppImage$/i.test(name)) return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`;
        if (/\.(exe|msi)$/i.test(name)) return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><polyline points="8 17 12 21 16 17"/><line x1="12" y1="12" x2="12" y2="21"/><line x1="3" y1="12" x2="21" y2="12"/></svg>`;
        return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
      }

      function assetLabel(name) {
        if (/\.AppImage$/i.test(name)) return 'Linux AppImage';
        if (/\.(exe|msi)$/i.test(name)) return 'Windows Installer';
        return name;
      }

      function assetBtnClass(name) {
        if (/\.AppImage$/i.test(name)) return 'btn btn-primary btn-sm';
        if (/\.(exe|msi)$/i.test(name)) return 'btn btn-secondary btn-sm';
        return 'btn btn-outline btn-sm';
      }

      function formatDate(iso) {
        return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      }

      try {
        const res = await fetch(API, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const releases = (await res.json()).sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

        if (!releases.length) {
          list.innerHTML = '<div class="releases-loading">No releases yet.</div>';
          return;
        }

        // A release is a beta if GitHub flags it as a pre-release (set by the
        // release CI) or its tag mentions "beta" — covers both the older
        // "_beta" tags and the newer "-beta" ones.
        const isBeta = r => r.prerelease || /beta/i.test(r.tag_name);
        const betaCount  = releases.filter(isBeta).length;
        const stableCount = releases.length - betaCount;
        if (countEl) {
          const parts = [];
          if (stableCount) parts.push(`${stableCount} stable`);
          if (betaCount)   parts.push(`${betaCount} beta`);
          countEl.textContent = `${releases.length} release${releases.length !== 1 ? 's' : ''} (${parts.join(', ')})`;
        }

        // First stable release gets the "Latest" highlight; first overall entry may be a beta
        const firstStableIdx = releases.findIndex(r => !isBeta(r));

        list.innerHTML = releases.map((r, i) => {
          const beta      = isBeta(r);
          const isLatest  = i === firstStableIdx;
          const cardClass = ['release-card', isLatest ? 'release-card--latest' : '', beta ? 'release-card--beta' : ''].filter(Boolean).join(' ');
          const downloads = r.assets
            .filter(a => /\.(AppImage|exe|msi)$/i.test(a.name))
            .map(a => `<a href="${a.browser_download_url}" class="${assetBtnClass(a.name)}">${assetIcon(a.name)} ${assetLabel(a.name)}</a>`)
            .join('');
          const body = mdToHtml(r.body);
          return `
          <div class="${cardClass}">
            <div class="release-card-header">
              <div class="release-meta">
                <span class="release-tag">${r.tag_name}</span>
                ${isLatest ? '<span class="badge badge--green">Latest</span>' : ''}
                ${beta     ? '<span class="badge badge--peach">Beta</span>'   : ''}
                <span class="release-date">${formatDate(r.published_at)}</span>
              </div>
              <div class="release-downloads">${downloads}</div>
            </div>
            ${body ? `<div class="release-body"><p>${body}</p></div>` : ''}
          </div>`;
        }).join('');

      } catch (err) {
        list.innerHTML = `<div class="releases-error">Could not load releases</div>`;
      }
    })();
  </script>

</body>
</html>
